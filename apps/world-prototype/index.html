<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PANCAKE DROP — World Prototype</title>
    <style>
      :root { color-scheme: dark; --accent: #f6c453; --bg: #0d0f14; --panel: rgba(13,15,20,.82); --line: #2a2e3a; --muted: #8a8f9c; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: #e8e6e1; font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      #hud { position: fixed; top: 12px; left: 12px; display: grid; grid-template-columns: auto auto; gap: 2px 18px; pointer-events: none; }
      #hud .k { color: var(--muted); font-size: 10px; letter-spacing: .1em; }
      #hud .v { font-size: 18px; font-weight: 700; color: #fff; }
      #hud .v.accent { color: var(--accent); }
      #controls { position: fixed; right: 12px; top: 12px; width: 250px; padding: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; backdrop-filter: blur(6px); }
      #controls h2 { font-size: 10px; letter-spacing: .1em; color: var(--muted); margin: 8px 0 4px; }
      .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 3px 0; }
      .row label { color: #aab0bd; }
      select, input[type=number] { width: 120px; background: #151821; color: #e8e6e1; border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; font: inherit; }
      button { background: var(--accent); color: #1a1400; border: 0; border-radius: 6px; padding: 5px 9px; font: inherit; font-weight: 700; cursor: pointer; }
      button.secondary { background: var(--line); color: #e8e6e1; }
      .buttons { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
      #debug { position: fixed; left: 12px; bottom: 12px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; white-space: pre; color: #cfd3dc; font-size: 11px; }
      #altitude { position: fixed; right: 12px; bottom: 12px; top: 300px; width: 120px; pointer-events: auto; }
      #altitude svg { width: 100%; height: 100%; }
      #altitude text { font: 9px ui-monospace, monospace; fill: #cfd3dc; }
      #altitude .tick { stroke: var(--line); }
      #altitude .tower { stroke: var(--accent); stroke-width: 3; }
      #altitude .hit { cursor: pointer; fill: transparent; }
      #heightMode { display: none; position: fixed; inset: 0; background: linear-gradient(#020308 0%, #0d1a33 60%, #1b2a44 100%); z-index: 20; }
      #heightMode svg { width: 100%; height: 100%; }
      #heightMode text { font: 12px ui-monospace, monospace; fill: #e8e6e1; }
      #heightMode .close { position: absolute; top: 12px; right: 12px; }
      body.shot #controls, body.shot #debug, body.shot #altitude { display: none; }
      @media (max-width: 640px) { #controls { width: calc(100% - 24px); max-height: 40%; overflow: auto; } #altitude { display: none; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div class="k">PANCAKES</div><div class="v" id="hudCount">0</div>
      <div class="k">HEIGHT</div><div class="v accent" id="hudHeight">0 m</div>
      <div class="k">VISIBLE</div><div class="v" id="hudVisible">0</div>
      <div class="k">CHUNKS</div><div class="v" id="hudChunks">0 / 0</div>
      <div class="k">FPS</div><div class="v" id="hudFps">0</div>
      <div class="k">QUALITY</div><div class="v" id="hudQuality">standard</div>
      <div id="hudNextRow" style="display:none"><div class="k">NEXT DROP</div><div class="v accent" id="hudNext">—</div></div>
    </div>
    <div id="controls">
      <h2>WORLD</h2>
      <div class="row"><label>Source</label><select id="sourceSel"><option value="local">local synthetic</option><option value="server">server</option></select></div>
      <div class="row"><label>Quality</label><select id="quality"><option value="performance">performance</option><option value="standard" selected>standard</option><option value="ultra">ultra</option></select></div>
      <div class="row"><label>Pancakes (synthetic)</label><select id="count"><option>10000</option><option selected>100000</option><option>500000</option><option>1000000</option></select></div>
      <div class="row"><label>Far view</label><select id="far"><option value="pure">A pure</option><option value="silhouette" selected>B silhouette</option><option value="atmospheric">C atmospheric</option><option value="both">B+C</option></select></div>
      <h2>NAVIGATION</h2>
      <div class="row"><label>Find #</label><span><input id="findId" type="number" value="54321" min="1" style="width:80px" /> <button id="find">FIND</button></span></div>
      <div class="buttons"><button id="full" class="secondary">FULL TOWER</button><button id="top" class="secondary">TOP</button><button id="height" class="secondary">HEIGHT VIEW</button></div>
      <h2>DROP</h2>
      <div class="row"><label>New pancakes</label><select id="dropN"><option>100</option><option selected>1000</option><option>5000</option><option>10000</option></select></div>
      <div class="buttons"><button id="drop">SIMULATE DROP</button><button id="replay" class="secondary" disabled>REPLAY</button></div>
      <div id="dropStatus" style="color:var(--muted);margin-top:4px"></div>
    </div>
    <div id="altitude"></div>
    <div id="debug">—</div>
    <div id="heightMode"><button class="close secondary" id="heightClose">CLOSE</button><div id="heightSvg" style="position:absolute;inset:0"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
